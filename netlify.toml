[build]
  # No build command needed for static site
  publish = "."

[[redirects]]
  from = "/"
  to = "/index-v2.html"
  status = 200

[[redirects]]
  from = "/v1"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/v2"
  to = "/index-v2.html"
  status = 200

[[redirects]]
  from = "/v3"
  to = "/index-v3.html"
  status = 200

[build.environment]
  # No environment variables needed for this static site

